{% load static access_theme %}
{% access_site_settings as site %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Administration{% endblock %} | Sacred Heart Forms</title>
    <link rel="stylesheet" href="{% static 'main/site/vendor/bootstrap/css/bootstrap.min.css' %}">
    <style>
        :root {
            --access-primary: {{ site.banner_bg_color|default:"#8b1e2d" }};
            --access-primary-hover: {{ site.primary_bg_color_10|default:"#731925" }};
            --access-primary-foreground: {{ site.banner_fg_color|default:"#ffffff" }};
        }
        body { background: #f4f6f8; }
        .auth-card { max-width: 38rem; margin: 8vh auto; border: 0; box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.12); }
        .auth-card .card-header {
            background: var(--access-primary);
            color: var(--access-primary-foreground);
        }
        .auth-card label { font-weight: 600; }
        .auth-card input { display: block; width: 100%; padding: .5rem .75rem; border: 1px solid #ced4da; border-radius: .25rem; }
        .auth-card .btn-primary {
            background-color: var(--access-primary);
            border-color: var(--access-primary);
            color: var(--access-primary-foreground);
        }
        .auth-card .btn-primary:hover,
        .auth-card .btn-primary:focus {
            background-color: var(--access-primary-hover);
            border-color: var(--access-primary-hover);
            color: var(--access-primary-foreground);
        }
        .auth-card a:not(.btn):not(.list-group-item) { color: var(--access-primary); }
    </style>
</head>
<body>
<main class="container">
    <section class="card auth-card">
        <header class="card-header py-3"><h1 class="h4 mb-0">{% block heading %}Administration{% endblock %}</h1></header>
        <div class="card-body p-4">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
            {% block content %}{% endblock %}
        </div>
    </section>
</main>
</body>
</html>
